# Render blueprint. Point Render at this repo and it picks this up.
# Secrets are NOT here — set them in Render → Environment, using
# .env.example as the checklist.
services:
  - type: web
    name: nexas-api
    runtime: node
    plan: starter          # free instances sleep, and a sleeping service
                           # misses payment webhooks. Do not use free here.
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
